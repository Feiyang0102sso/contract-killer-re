[common]
Title=Contract Killer

[graph]
Engine=m3g                              ; 3D engine: m3g = native m3gcore, swerve = original Swerve run in Unicorn
WindowWidth=2048                       ; Window width; shrunk to fit the desktop. Game renders at 1024x768
WindowHeight=1536                       ; Window height
FullScreen=0                            ; Fullscreen (0/1)
VSync=1                                 ; VSync (0/1). Off = uncapped FPS, use with care

[game]
DrawFPS=1                               ; Always draw the current FPS
KeyHints=1                              ; Show the bound key on the mission HUD buttons (0/1)

[debug]
DebugMode=0                             ; Debug mode (0/1): console window + debug hotkeys below
FpsLog=0                                ; Print FPS, frame time and CPU time every second (0/1), needs DebugMode=1

; Debug hotkeys (DebugMode=1):
;   F9               Dump the next frame to frame_N_1024x768.rgba next to the exe

; Mission controls (the mouse is captured while the mission HUD is live; edit KeyBindings.h to rebind):
;   Mouse            Turn the view          Left button      Fire (hold)
;   Right button     Scope in / out         Wheel            Scope zoom
;   Shift            STEADY (hold breath)   R                Reload
;   Q / E            Switch weapon          C                Take / leave cover
;   H                Medkit                 F                Slow motion pill
;   G                Ultrasound emitter     Esc              Pause
;   S                In-mission shop

; Cheat codes (type the letters once the game has loaded, no input box; best on the map, since
; C and H are also mission keys):
;   chm              Cash +9,999,999, gold set to 99,999 (the map shows five digits of gold)
;   chxp             Level +1
;   chxxp            Level +10
;   chxxxp           Top level (70)
